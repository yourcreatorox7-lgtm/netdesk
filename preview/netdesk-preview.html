## \u0642\u062F\u0645 \u06F3: \u0627\u062A\u0635\u0627\u0644 \u0647\u0648\u0634\u0645\u0646\u062F

\u062F\u0631 \u0635\u0641\u062D\u0647\u200C\u06CC \xAB\u062E\u0627\u0646\u0647\xBB \u062F\u06A9\u0645\u0647\u200C\u06CC \u0628\u0632\u0631\u06AF **\u0627\u062A\u0635\u0627\u0644 \u0647\u0648\u0634\u0645\u0646\u062F** \u0631\u0627 \u0628\u0632\u0646\u06CC\u062F. \u0628\u0631\u0646\u0627\u0645\u0647 \u062E\u0648\u062F\u0634 \u0627\u06CC\u0646 \u06A9\u0627\u0631\u0647\u0627 \u0631\u0627 \u0627\u0646\u062C\u0627\u0645 \u0645\u06CC\u200C\u062F\u0647\u062F:

1. \u062F\u0633\u062A\u0631\u0633\u06CC \u0647\u0645\u0647\u200C\u06CC \u0633\u0631\u0648\u0631\u0647\u0627 \u0631\u0627 \u0647\u0645\u200C\u0632\u0645\u0627\u0646 \u0645\u06CC\u200C\u0633\u0646\u062C\u062F.
2. \u0633\u0631\u06CC\u0639\u200C\u062A\u0631\u06CC\u0646\u200C\u0647\u0627 \u0631\u0627 \u0628\u0627 \u06CC\u06A9 \u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0648\u0627\u0642\u0639\u06CC \u0627\u0632 \u062F\u0627\u062E\u0644 \u062A\u0648\u0646\u0644 \u0627\u0645\u062A\u062D\u0627\u0646 \u0645\u06CC\u200C\u06A9\u0646\u062F.
3. \u0627\u06AF\u0631 \u0627\u062A\u0635\u0627\u0644 \u0645\u0639\u0645\u0648\u0644\u06CC \u06A9\u0627\u0631 \u0646\u06A9\u0631\u062F\u060C \u062F\u0648\u0628\u0627\u0631\u0647 \u0628\u0627 TLS fragment \u0627\u0645\u062A\u062D\u0627\u0646 \u0645\u06CC\u200C\u06A9\u0646\u062F.
4. \u0628\u0647\u062A\u0631\u06CC\u0646 \u0631\u0627 \u0648\u0635\u0644 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u067E\u0631\u0648\u06A9\u0633\u06CC \u0648\u06CC\u0646\u062F\u0648\u0632 \u0631\u0627 \u062A\u0646\u0638\u06CC\u0645 \u0645\u06CC\u200C\u06A9\u0646\u062F.
5. \u0627\u06AF\u0631 \u0627\u062A\u0635\u0627\u0644 \u0642\u0637\u0639 \u0634\u062F\u060C \u062E\u0648\u062F\u0634 \u0633\u0631\u0627\u063A \u0633\u0631\u0648\u0631 \u0628\u0639\u062F\u06CC \u0645\u06CC\u200C\u0631\u0648\u062F.

\u0628\u0627 \xAB\u0642\u0637\u0639 \u0627\u062A\u0635\u0627\u0644\xBB \u06CC\u0627 \u0628\u0633\u062A\u0646 \u0628\u0631\u0646\u0627\u0645\u0647\u060C \u062A\u0646\u0638\u06CC\u0645 \u067E\u0631\u0648\u06A9\u0633\u06CC \u0648\u06CC\u0646\u062F\u0648\u0632 \u0628\u0647 \u062D\u0627\u0644\u062A \u0642\u0628\u0644 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F.
