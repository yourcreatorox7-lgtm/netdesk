[package]
name = "netdesk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultimate Network Desktop Suite"

# پروژه‌ی مستقل از workspace ریشه (نیاز به اینترنت برای دریافت crateها)
[workspace]

[lib]
name = "netdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netcore = { path = "../crates/netcore" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# انبار امن رمزها: Windows Credential Manager / macOS Keychain / Secret Service
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
